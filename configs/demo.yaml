# Small, competence-gated demonstration.  Only run with experiments/run_demo.py.
defaults: ["_base.yaml"]

run:
  profile: "demo"
  description: "Competence-gated two-step demonstration: seven layers, three lenses."
  implementation_revision: "independent-matched-control-v5"

model:
  # Qwen3.5 thinks by default.  The official non-thinking chat template inserts
  # a closed <think> block; the Answer: assistant prefill then places the
  # readout at a direct, space-prefixed single-token answer slot.
  prompt_interface: "qwen35_nonthinking_prefill"
  system_prompt: "Solve the table-composition problem. Continue the assistant's Answer: prefix with exactly one allowed codeword and nothing else."
  assistant_prefill: "Answer:"

tasks:
  families: ["demo_two_step", "null_lookup"]
  modulus: 5
  n_groups_per_family: 200
  primary_groups: 200
  control_groups: 24
  n_shots: 3
  n_absent_codewords: 1
  n_random_candidates: 1
  splits: {train: 0.50, val: 0.20, test: 0.30}
  holdout_template_fraction: 0.25

demo:
  competence:
    development_groups_per_seed: 50
    development_seed_offsets: [900000, 910000, 920000]
    target_accuracy: 0.80
    hard_min_accuracy: 0.75
    minimum_seed_accuracy: 0.75
    confirmation_groups: 200
    confirmation_seed_offset: 930000
    # Frozen easier order.  Each prompt shows only the two traversed active
    # edges plus a surface-matched, statistically independent unused path and the full randomized
    # codebook.  Two independent worked examples teach the interface without
    # leaking the final problem's codewords.  Lens code is not loaded until a
    # preset passes multi-seed development and independent confirmation.
    presets:
      - {name: path_worked_m3, task_kind: lookup_chain, prompt_style: minimal, ordered_tables: true, modulus: 3, n_shots: 2, explicit_trace: true}
      - {name: path_worked_m2, task_kind: lookup_chain, prompt_style: minimal, ordered_tables: true, modulus: 2, n_shots: 2, explicit_trace: true}
  representation:
    matched_control_margin: 0.05
    invalidate_if_control_within: 0.05
  causal:
    min_pairs: 20
    min_mean_nme: 0.30
    min_nme_ci_lower: 0.10
    require_correct_base_and_donor: true
    controls:
      # cf_self and cf_decoy share the base answer, so the donor-vs-base logit
      # contrast is identically zero for them and cannot serve as a control.
      # The controls are answer preservation instead: an identity patch must be
      # a no-op, and a decoy patch must disturb the answer no more than an
      # active-chain patch does.  The decoy bound is relative on purpose, so a
      # lower-accuracy model does not fail it for the wrong reason.
      identity_min_preservation: 0.99
      decoy_margin_over_informative: 0.0
  success:
    require_nonzero_represented: true
    require_nonzero_causal: true
    require_nonzero_overlap: true

activations:
  layers: [0, 5, 10, 15, 20, 25, 30]
  positions: ["last"]
  batch_size: 16

representation:
  variables: ["z1", "z2", "answer"]
  n_permutations: 50
  criterion:
    min_balanced_acc_margin: 0.10
    permutation_quantile: 0.95

causal:
  donor_types: ["cf_z1", "cf_z2", "cf_y", "cf_decoy", "cf_self"]
  batch_size: 24
  chunk_layers: 7
  criterion:
    # DEMO deliberately does not threshold raw IIA. It filters to pairs where
    # both prompts are solved, then requires a donor-directed NME with a
    # positive group-bootstrap lower bound.
    rule: "correct-pairs_nme_ci"
    min_pairs: 20
    min_mean_nme: 0.30
    min_nme_ci_lower: 0.10

readout:
  methods: ["j_lens", "r_lens", "logit_lens"]
  event_splits: ["val", "test"]
  score: "normalized_score"
  compute_vocab_rank: false

metrics:
  bootstrap:
    n_replicates: 500
    unit: "group_id"
  topk: [1, 3, 5]
  coverage_targets: [0.05, 0.10, 0.25]
  precision_targets: [0.50, 0.70, 0.80]
  calibration:
    enabled: false

refit:
  enabled: false
  j_lens: {}
  r_lens: {}

baselines:
  methods: []
